# Production logging must not expose SQL or bind-related implementation details.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Production must never inherit the development database or JWT secret defaults
# declared in application.properties.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
security.jwt.secret=${JWT_SECRET}

# Flyway owns production schema changes; Hibernate only validates mappings.
spring.jpa.hibernate.ddl-auto=validate

# A new empty production database must run V1. Set this to true only once when
# adopting Flyway for a verified, already populated database without history.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}

# Nginx serves the frontend and /api from one origin in the target deployment.
# Leave this empty unless another browser origin must call Spring directly.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
