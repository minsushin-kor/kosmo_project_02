# Production logging must not expose SQL or bind-related implementation details.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# No migration tool exists yet, so changing the default to validate would prevent
# a fresh managed database from starting. Keep update temporarily and override it
# explicitly after versioned migrations are introduced.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Nginx serves the frontend and /api from one origin in the target deployment.
# Leave this empty unless another browser origin must call Spring directly.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
