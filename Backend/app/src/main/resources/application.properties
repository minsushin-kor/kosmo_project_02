spring.application.name=app

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/petpulse}
spring.datasource.username=${DB_USERNAME:petpulse_user}
spring.datasource.password=${DB_PASSWORD:petpulse1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# Existing local databases were created by Hibernate. Flyway records V1 as a
# baseline without rerunning the initial DDL; empty databases still execute V1.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-migration-naming=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# JWT defaults are for local development only. Override both values in deployed environments.
security.jwt.secret=${JWT_SECRET:petpulse-development-secret-key-change-me}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# FastAPI base URL. Override in deployed environments.
ai.fastapi.base-url=${FASTAPI_BASE_URL:http://127.0.0.1:8000}
ai.fastapi.connect-timeout-seconds=${FASTAPI_CONNECT_TIMEOUT_SECONDS:3}
ai.fastapi.read-timeout-seconds=${FASTAPI_READ_TIMEOUT_SECONDS:30}

# Comma-separated browser origins allowed to call Spring APIs directly.
# Same-origin requests routed by Nginx do not require a CORS entry.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
